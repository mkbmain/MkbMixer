name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Builds via the test project rather than the solution, so the Android head
      # (and its workload) is never needed.
      - name: Build
        run: dotnet build tests/Mkb.Mixer.Tests/Mkb.Mixer.Tests.csproj -c Release

      # Runners have no sound card, so the tests that open a real output device
      # are tagged Category=Audio and left to local runs.
      - name: Test
        run: >
          dotnet test tests/Mkb.Mixer.Tests/Mkb.Mixer.Tests.csproj -c Release --no-build
          --filter "Category!=Audio" --logger "console;verbosity=normal"

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android workload
        run: dotnet workload install android

      # The runner ships an Android SDK, but not necessarily the platform the
      # workload targets; this fetches whatever is missing.
      - name: Install Android dependencies
        run: >
          dotnet build src/Mkb.Mixer.App.Android/Mkb.Mixer.App.Android.csproj
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=true

      # With the ANDROID_KEYSTORE_BASE64 secret set, the APK is signed with the
      # release key; otherwise (including PRs from forks) with a throwaway debug
      # key, which installs fine but cannot upgrade over a differently signed copy.
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A v1.2.3 tag stamps version 1.2.3 (code 1002003), so each release
          # installs as an upgrade over the last; other builds keep the dev version.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export MKB_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          ./build-apk.sh Release

      - uses: actions/upload-artifact@v7
        with:
          name: mkb-mixer-apk
          path: dist/*.apk
          if-no-files-found: error

  # Self-contained, so the download runs without a .NET install. Not single-file
  # and not trimmed: miniaudio's native library has to sit beside the executable.
  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest, archive: tar.gz }
          - { rid: win-x64, os: windows-latest, archive: zip }
          - { rid: osx-arm64, os: macos-latest, archive: tar.gz }
          # An arm64 runner cannot execute an x64 build, so this one is not smoke-tested.
          - { rid: osx-x64, os: macos-latest, archive: tar.gz, nosmoke: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # A v1.2.3 tag stamps version 1.2.3; other builds are named dev and keep the
      # project's own version, since "dev" is not a valid assembly version.
      - name: Publish
        env:
          RID: ${{ matrix.rid }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION_ARG="-p:Version=$VERSION"
          else
            VERSION=dev
            VERSION_ARG=""
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          dotnet publish src/Mkb.Mixer.App.Desktop -c Release -r "$RID" --self-contained \
            $VERSION_ARG -o "out/mkb-mixer-$VERSION-$RID"

      # Runners have no sound card, but --audio-info still lists the compiled-in
      # backends, which proves the native library loads. On Windows the redirect is
      # what captures the output of the WinExe program.
      - name: Smoke test
        if: ${{ !matrix.nosmoke }}
        working-directory: out/mkb-mixer-${{ env.VERSION }}-${{ matrix.rid }}
        run: |
          ./Mkb.Mixer.App.Desktop --audio-info > audio-info.txt
          cat audio-info.txt
          grep -q "miniaudio compiled-in backends" audio-info.txt
          rm audio-info.txt

      - name: Archive
        env:
          RID: ${{ matrix.rid }}
        run: |
          NAME="mkb-mixer-$VERSION-$RID"
          mkdir -p dist
          cd out
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "../dist/$NAME.zip" "$NAME"
          else
            tar -czf "../dist/$NAME.tar.gz" "$NAME"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: mkb-mixer-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [apk, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --verify-tag needs a repository to look the tag up in.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
